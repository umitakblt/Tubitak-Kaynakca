<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esenyurt Anadolu Lisesi | QR Kodlar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .qr-dashboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            width: 100%;
            margin-top: 40px;
        }

        .qr-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            color: #0f172a;
        }

        .qr-card h3 {
            font-size: 1rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .qr-card .school-name {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }

        .qr-card img {
            width: 150px;
            height: 150px;
        }

        .print-btn {
            margin-top: 40px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .print-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }

        @media print {
            body {
                background: white;
                color: black;
            }
            .background-blobs, .print-btn, header {
                display: none !important;
            }
            .qr-card {
                box-shadow: none;
                border: 1px solid #ccc;
                page-break-inside: avoid;
            }
            .qr-dashboard {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container qr-dashboard">
        <header class="header animate-fade-in">
            <div class="badge">ESENYURT ANADOLU LİSESİ</div>
            <h1>Yazdırılabilir QR Kodlar</h1>
            <p class="subtitle">Bu sayfadaki QR kodları yazdırıp kartonlara yapıştırabilirsiniz. Okutulduğunda kaynakça sayfası açılacaktır.</p>
        </header>

        <div class="qr-grid" id="qr-grid">
            <!-- JavaScript ile doldurulacak -->
        </div>

        <button class="print-btn" onclick="window.print()">Bu Sayfayı Çıktı Al (Yazdır)</button>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="qr.js"></script>
</body>
</html>
